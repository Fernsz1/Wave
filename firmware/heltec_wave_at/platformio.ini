; PlatformIO build config for the Wave Heltec AT-emulation firmware.
; Alternative to the Arduino IDE — open this folder in VS Code with the
; PlatformIO extension and hit Upload. Flash the same image to both boards.
;
;   pio run -t upload --upload-port COM3   # Heltec A
;   pio run -t upload --upload-port COM4   # Heltec B
;
; PlatformIO expects sources under src/. Either move heltec_wave_at.ino into
; src/ or add `src_dir = .` (done below) so the sketch in this folder is built.

[platformio]
src_dir = .

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib @ ^6.4.0
